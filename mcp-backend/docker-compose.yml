services:
    mcp-server:
        build: .
        ports:
            - "3000:3000"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "bun", "-e", 'fetch("http://127.0.0.1:3000/health/live").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s
