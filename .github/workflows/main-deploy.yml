# E2E and MCP exposure tests gate deploy on push to main.
name: Deploy to production # Runs on every push to main after merge

on:
    push:
        branches:
            - main

concurrency:
    group: main-deploy # Only one deployment at a time; queue rather than cancel
    cancel-in-progress: false

permissions:
    contents: read
    actions: write

jobs:
    e2e-tests:
        uses: ./.github/workflows/reusable-e2e-tests.yml

    mcp-exposure:
        uses: ./.github/workflows/reusable-mcp-exposure.yml

    deploy:
        name: SSH deploy
        needs: [e2e-tests, mcp-exposure]
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to Hetzner VPS
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.HETZNER_HOST }}
                  username: ${{ secrets.HETZNER_USER }}
                  key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      cd ${{ secrets.HETZNER_REPO_PATH }}
                      git fetch origin main
                      git reset --hard origin/main
                      docker compose -f docker-compose.prod.yml up -d --build
